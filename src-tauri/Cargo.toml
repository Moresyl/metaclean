[package]
name = "metaclean"
version = "0.5.0"
description = "Offline file privacy cleaner"
authors = ["Moresyl"]
license = "MIT"
repository = "https://github.com/Moresyl/metaclean"
edition = "2021"

[lib]
name = "metaclean_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-wdio = { version = "1.3", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.44"
quick-xml = "0.41"
regex = "1"
tempfile = "3"
thiserror = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }
filetime = "0.2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1.6"

[features]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[profile.dev]
debug = 0

[profile.test]
debug = 0
