[package]
name = "metaclean"
version = "0.1.0"
description = "Offline file privacy cleaner"
authors = ["Moresl"]
edition = "2021"

[lib]
name = "metaclean_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.38"
quick-xml = "0.38"
regex = "1"
tempfile = "3"
thiserror = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }
