name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v0.4.0
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            updaterPlatform: windows-x86_64
            args: --bundles "nsis,msi"
            bundlePath: src-tauri/target/release/bundle
            extensions: exe,msi,zip
            architecture: x64
            binaryPath: src-tauri/target/release/metaclean.exe
          - platform: windows-latest
            target: i686-pc-windows-msvc
            updaterPlatform: windows-i686
            args: --target i686-pc-windows-msvc --bundles nsis
            bundlePath: src-tauri/target/i686-pc-windows-msvc/release/bundle
            extensions: exe,zip
            architecture: x86
            binaryPath: src-tauri/target/i686-pc-windows-msvc/release/metaclean.exe
          - platform: macos-latest
            target: aarch64-apple-darwin
            updaterPlatform: darwin-aarch64
            args: --target aarch64-apple-darwin --bundles "app,dmg"
            bundlePath: src-tauri/target/aarch64-apple-darwin/release/bundle
            extensions: dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            updaterPlatform: darwin-x86_64
            args: --target x86_64-apple-darwin --bundles "app,dmg"
            bundlePath: src-tauri/target/x86_64-apple-darwin/release/bundle
            extensions: dmg
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            updaterPlatform: linux-x86_64
            args: --bundles deb,rpm,appimage
            bundlePath: src-tauri/target/release/bundle
            extensions: deb,rpm,AppImage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@10.32.1 --activate
      - run: rustup default stable
      - run: rustup target add ${{ matrix.target }}
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-release-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-release-${{ runner.os }}-${{ matrix.target }}-
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - run: pnpm install --frozen-lockfile
      - name: Validate bilingual release notes
        run: node scripts/load-release-notes.mjs
      - name: Build release packages
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Package the portable Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows-portable.ps1 -BinaryPath "${{ matrix.binaryPath }}" -BundleDirectory "${{ matrix.bundlePath }}" -Architecture "${{ matrix.architecture }}"
      - name: Smoke-test the installed Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-windows-installer.ps1 -BundleDirectory "${{ matrix.bundlePath }}"
      - name: Smoke-test the portable Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-windows-portable.ps1 -BundleDirectory "${{ matrix.bundlePath }}" -Architecture "${{ matrix.architecture }}"
      - name: Smoke-test the copied macOS application
        if: runner.os == 'macOS'
        run: bash scripts/smoke-macos-dmg.sh "${{ matrix.bundlePath }}"
      - name: Smoke-test the installed Linux package
        if: runner.os == 'Linux'
        run: bash scripts/smoke-linux-deb.sh "${{ matrix.bundlePath }}"
      - name: Collect validated release assets
        run: node scripts/collect-release-assets.mjs "${{ matrix.bundlePath }}" "${{ runner.temp }}/release-assets" "${{ matrix.extensions }}"
      - name: Collect signed updater assets
        run: node scripts/collect-updater-assets.mjs "${{ matrix.bundlePath }}" "${{ runner.temp }}/release-assets" "${{ matrix.updaterPlatform }}" "${{ env.RELEASE_TAG }}"
      - uses: actions/upload-artifact@v6
        with:
          name: packages-${{ matrix.target }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 1

  finalize:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
      - name: Validate bilingual release notes
        run: node scripts/load-release-notes.mjs
      - name: Generate signed updater manifest
        run: |
          publication_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node scripts/generate-updater-manifest.mjs "${{ runner.temp }}/release-assets" "$RELEASE_TAG" "${{ github.repository }}" "release-notes/$RELEASE_TAG.md" "$publication_date" "${{ runner.temp }}/release-assets/latest.json"
      - name: Generate SHA-256 manifest
        run: node scripts/generate-checksums.mjs "${{ runner.temp }}/release-assets" "${{ runner.temp }}/SHASUMS256.txt"
      - name: Create the public release only after every smoke test passes
        run: gh release create "$RELEASE_TAG" "${{ runner.temp }}"/release-assets/* "${{ runner.temp }}/SHASUMS256.txt" --title "MetaClean $RELEASE_TAG" --notes-file "release-notes/$RELEASE_TAG.md" --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
