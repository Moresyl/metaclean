name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish, for example v0.12.0
        required: true
        type: string
      source_commit:
        description: Optional full commit SHA; creates the version tag only after all checks pass
        required: false
        default: ""
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  SOURCE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.source_commit || '' }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_commit || (github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name) }}
  APPIMAGE_UPDATE_INFORMATION: gh-releases-zsync|Moresyl|metaclean|latest|MetaClean_*_amd64.AppImage.zsync

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify immutable release source and version
        run: node scripts/verify-release-source.mjs
      - run: corepack enable
      - run: corepack prepare pnpm@10.32.1 --activate
      - run: rustup default stable
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb ffmpeg poppler-utils
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install reportlab==4.4.9 pypdf==6.7.0 Pillow==12.2.0 pillow-heif==1.3.0
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-release-validation-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-release-validation-
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:supply-chain
      - run: pnpm test:security
      - run: pnpm test:release
      - run: pnpm test:formats
      - run: pnpm test:docs
      - run: pnpm docs:build
      - run: pnpm audit --audit-level moderate --registry=https://registry.npmjs.org
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Run desktop E2E under Xvfb
        run: xvfb-run --auto-servernum pnpm test:e2e
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - name: Verify Ogg playback against FFmpeg
        run: pnpm test:audio
      - name: Verify PDF fidelity with independent tools
        run: python scripts/verify-pdf-fidelity.py --renderer poppler --output "${{ runner.temp }}/metaclean-pdf-evidence"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release-pdf-fidelity-evidence
          path: ${{ runner.temp }}/metaclean-pdf-evidence
          if-no-files-found: warn
      - name: Verify HEIF and AVIF fidelity with independent codecs
        run: python scripts/verify-heif-fidelity.py --output "${{ runner.temp }}/metaclean-heif-evidence"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release-heif-fidelity-evidence
          path: ${{ runner.temp }}/metaclean-heif-evidence
          if-no-files-found: warn
      - name: Verify JPEG print density and display fidelity
        run: python scripts/verify-jpeg-fidelity.py --output "${{ runner.temp }}/metaclean-jpeg-evidence"
      - name: Verify PNG timestamp removal, pixels and animation
        run: python scripts/verify-png-fidelity.py --output "${{ runner.temp }}/metaclean-png-evidence"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release-png-fidelity-evidence
          path: ${{ runner.temp }}/metaclean-png-evidence
          if-no-files-found: warn
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release-jpeg-fidelity-evidence
          path: ${{ runner.temp }}/metaclean-jpeg-evidence
          if-no-files-found: warn
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo llvm-cov --locked --ignore-filename-regex '(lib|main|models|shell_integration)\.rs$' --fail-under-lines 80
        working-directory: src-tauri
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: src-tauri

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            updaterPlatform: windows-x86_64
            args: --bundles "nsis,msi"
            bundlePath: src-tauri/target/release/bundle
            extensions: exe,msi,zip
            architecture: x64
            binaryPath: src-tauri/target/release/metaclean.exe
          - platform: windows-latest
            target: i686-pc-windows-msvc
            updaterPlatform: windows-i686
            args: --target i686-pc-windows-msvc --bundles nsis
            bundlePath: src-tauri/target/i686-pc-windows-msvc/release/bundle
            extensions: exe,zip
            architecture: x86
            binaryPath: src-tauri/target/i686-pc-windows-msvc/release/metaclean.exe
          - platform: macos-latest
            target: aarch64-apple-darwin
            updaterPlatform: darwin-aarch64
            args: --target aarch64-apple-darwin --bundles "app,dmg"
            bundlePath: src-tauri/target/aarch64-apple-darwin/release/bundle
            extensions: dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            updaterPlatform: darwin-x86_64
            args: --target x86_64-apple-darwin --bundles "app,dmg"
            bundlePath: src-tauri/target/x86_64-apple-darwin/release/bundle
            extensions: dmg
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            updaterPlatform: linux-x86_64
            args: --bundles deb,rpm,appimage
            bundlePath: src-tauri/target/release/bundle
            extensions: deb,rpm,AppImage,zsync
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@10.32.1 --activate
      - run: rustup default stable
      - run: rustup target add ${{ matrix.target }}
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-release-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-release-${{ runner.os }}-${{ matrix.target }}-
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm zsync
      - run: pnpm install --frozen-lockfile
      - name: Validate bilingual release notes
        run: node scripts/load-release-notes.mjs
      - name: Build release packages
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LDAI_UPDATE_INFORMATION: ${{ runner.os == 'Linux' && env.APPIMAGE_UPDATE_INFORMATION || '' }}
      - name: Verify the Windows executable uses the GUI subsystem
        if: runner.os == 'Windows'
        run: node scripts/verify-windows-gui-subsystem.mjs "${{ matrix.binaryPath }}"
      - name: Place AppImage delta metadata beside the release package
        if: runner.os == 'Linux'
        run: node scripts/prepare-appimage-zsync.mjs "${{ matrix.bundlePath }}"
      - name: Verify AppImage update information and delta metadata
        if: runner.os == 'Linux'
        run: node scripts/verify-appimage-update.mjs "${{ matrix.bundlePath }}" "$APPIMAGE_UPDATE_INFORMATION"
      - name: Package the portable Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows-portable.ps1 -BinaryPath "${{ matrix.binaryPath }}" -BundleDirectory "${{ matrix.bundlePath }}" -Architecture "${{ matrix.architecture }}"
      - name: Smoke-test the installed Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-windows-installer.ps1 -BundleDirectory "${{ matrix.bundlePath }}"
      - name: Smoke-test the MSI Windows package
        if: runner.os == 'Windows' && matrix.architecture == 'x64'
        shell: pwsh
        run: ./scripts/smoke-windows-msi.ps1 -BundleDirectory "${{ matrix.bundlePath }}"
      - name: Smoke-test the portable Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-windows-portable.ps1 -BundleDirectory "${{ matrix.bundlePath }}" -Architecture "${{ matrix.architecture }}"
      - name: Smoke-test the copied macOS application
        if: runner.os == 'macOS'
        run: bash scripts/smoke-macos-dmg.sh "${{ matrix.bundlePath }}"
      - name: Smoke-test the installed Linux package
        if: runner.os == 'Linux'
        run: bash scripts/smoke-linux-deb.sh "${{ matrix.bundlePath }}"
      - name: Collect validated release assets
        run: node scripts/collect-release-assets.mjs "${{ matrix.bundlePath }}" "${{ runner.temp }}/release-assets" "${{ matrix.extensions }}"
      - name: Collect signed updater assets
        run: node scripts/collect-updater-assets.mjs "${{ matrix.bundlePath }}" "${{ runner.temp }}/release-assets" "${{ matrix.updaterPlatform }}" "${{ env.RELEASE_TAG }}"
      - uses: actions/upload-artifact@v6
        with:
          name: packages-${{ matrix.target }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 1

  finalize:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
      - name: Validate bilingual release notes
        run: node scripts/load-release-notes.mjs
      - name: Generate signed updater manifest
        run: |
          publication_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node scripts/generate-updater-manifest.mjs "${{ runner.temp }}/release-assets" "$RELEASE_TAG" "${{ github.repository }}" "release-notes/$RELEASE_TAG.md" "$publication_date" "${{ runner.temp }}/release-assets/latest.json"
      - name: Generate SHA-256 manifest
        run: node scripts/generate-checksums.mjs "${{ runner.temp }}/release-assets" "${{ runner.temp }}/SHASUMS256.txt"
      - name: Tag the verified manual source after every smoke test passes
        if: env.SOURCE_COMMIT != ''
        run: |
          node scripts/verify-release-source.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' tag -a "$RELEASE_TAG" -m "MetaClean $RELEASE_TAG" "$SOURCE_COMMIT"
          git push origin "refs/tags/$RELEASE_TAG"
      - name: Create the public release only after every smoke test passes
        run: gh release create "$RELEASE_TAG" "${{ runner.temp }}"/release-assets/* "${{ runner.temp }}/SHASUMS256.txt" --title "MetaClean $RELEASE_TAG" --notes-file "release-notes/$RELEASE_TAG.md" --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
