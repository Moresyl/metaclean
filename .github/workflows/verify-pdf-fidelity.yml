name: Verify independent PDF fidelity

on:
  workflow_dispatch:
  push:
    paths:
      - src-tauri/src/cleaners/pdf.rs
      - scripts/verify-pdf-fidelity.py
      - .github/workflows/verify-pdf-fidelity.yml

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: corepack enable
      - run: corepack prepare pnpm@10.32.1 --activate
      - run: rustup default stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-e2e-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-e2e-${{ runner.os }}-
      - name: Install independent PDF tools and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev poppler-utils
          python -m pip install reportlab==4.4.9 pypdf==6.7.0 Pillow==12.0.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify pages, text, fields, JPEG metadata and source integrity
        run: python scripts/verify-pdf-fidelity.py --renderer poppler --output "$RUNNER_TEMP/metaclean-pdf-evidence"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pdf-fidelity-evidence
          path: ${{ runner.temp }}/metaclean-pdf-evidence
          if-no-files-found: error
