name: Verify independent HEIF fidelity

on:
  workflow_dispatch:
  push:
    paths:
      - src-tauri/src/cleaners/heif.rs
      - scripts/verify-heif-fidelity.py
      - .github/workflows/verify-heif-fidelity.yml

permissions:
  contents: read

jobs:
  heif:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: corepack enable
      - run: corepack prepare pnpm@10.32.1 --activate
      - run: rustup default stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-e2e-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-e2e-${{ runner.os }}-
      - name: Install independent image codecs and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          python -m pip install Pillow==12.2.0 pillow-heif==1.3.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify pixels, alpha, orientation, profiles, frames and source integrity
        run: python scripts/verify-heif-fidelity.py --output "${{ runner.temp }}/metaclean-heif-evidence"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: heif-fidelity-evidence
          path: ${{ runner.temp }}/metaclean-heif-evidence
          if-no-files-found: error
