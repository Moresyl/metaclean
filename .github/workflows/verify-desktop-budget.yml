name: Measure desktop memory

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published stable version without v
        required: true
        type: string
      candidate:
        description: Build this revision instead of downloading the published version
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        size: [64, 256]
        iteration: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: inputs.candidate
        run: corepack enable
      - if: inputs.candidate
        run: corepack prepare pnpm@10.32.1 --activate
      - if: inputs.candidate
        run: rustup default stable
      - uses: actions/cache@v5
        if: inputs.candidate
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-memory-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-release-${{ runner.os }}-x86_64-pc-windows-msvc-
            rust-ci-${{ runner.os }}-
      - if: inputs.candidate
        run: pnpm install --frozen-lockfile
      - if: inputs.candidate
        run: pnpm tauri build --no-bundle
      - name: Test process identity and ancestry checks
        shell: pwsh
        run: ./scripts/process-tree.test.ps1
      - name: Measure real application and WebView processes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          FIXTURE_MIB: ${{ matrix.size }}
          MEASUREMENT_RUN: ${{ matrix.iteration }}
          BUILD_CANDIDATE: ${{ inputs.candidate }}
        run: ./scripts/verify-desktop-budget.ps1 -Version $env:RELEASE_VERSION -SizeMiB ([int]$env:FIXTURE_MIB) -Iteration ([int]$env:MEASUREMENT_RUN) -Candidate:($env:BUILD_CANDIDATE -eq 'true')
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: desktop-memory-${{ matrix.size }}-${{ matrix.iteration }}
          path: ${{ runner.temp }}/metaclean-memory-evidence/*
          if-no-files-found: error
