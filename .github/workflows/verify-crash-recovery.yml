name: Verify published cleanup crash recovery

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published stable version without v
        required: true
        type: string

permissions:
  contents: read

jobs:
  recovery:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Interrupt real cleanup and verify restart
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./scripts/verify-crash-recovery.ps1 -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cleanup-crash-evidence
          path: ${{ runner.temp }}/metaclean-crash-evidence/*.json
          if-no-files-found: error
