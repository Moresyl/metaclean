name: Documentation and update feed

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-feed.yml'
      - 'assets/metaclean-*.png'
      - 'assets/metaclean-*.gif'
      - 'docs/**'
      - 'DESIGN.md'
      - 'CHANGELOG.md'
      - 'VALIDATION.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/generate-updater-manifest.mjs'
      - 'scripts/stage-updater-feed.mjs'
      - 'src-tauri/tauri.conf.json'
  workflow_dispatch:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages-update-feed
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@10.32.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Build documentation site
        run: pnpm docs:build
        env:
          DOCS_BASE: /metaclean/
      - name: Download and validate the latest signed manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          mkdir -p "$RUNNER_TEMP/update-feed"
          cp -R docs/.vitepress/dist site
          manifest="$RUNNER_TEMP/update-feed/latest.json"
          max_attempts=12
          for attempt in $(seq 1 "$max_attempts"); do
            rm -f "$manifest"
            if gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$RUNNER_TEMP/update-feed"; then
              break
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::latest.json was not available after $max_attempts attempts"
              exit 1
            fi
            echo "latest.json is not visible yet; retrying in 5 seconds ($attempt/$max_attempts)"
            sleep 5
          done
          node scripts/stage-updater-feed.mjs "$RUNNER_TEMP/update-feed/latest.json" "$tag" "$GITHUB_REPOSITORY" site/latest.json
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
