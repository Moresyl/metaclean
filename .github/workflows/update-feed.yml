name: Update feed

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-feed.yml'
      - 'scripts/generate-updater-manifest.mjs'
      - 'scripts/stage-updater-feed.mjs'
      - 'src-tauri/tauri.conf.json'
  workflow_dispatch:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages-update-feed
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Download and validate the latest signed manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          mkdir -p "$RUNNER_TEMP/update-feed" site
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$RUNNER_TEMP/update-feed"
          node scripts/stage-updater-feed.mjs "$RUNNER_TEMP/update-feed/latest.json" "$tag" "$GITHUB_REPOSITORY" site/latest.json
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
