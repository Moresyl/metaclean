name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate --registry=https://registry.npmjs.org
      - run: pnpm test:coverage
      - run: pnpm build
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo llvm-cov --ignore-filename-regex '(lib|main|models|shell_integration)\.rs$' --fail-under-lines 80
        working-directory: src-tauri
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: src-tauri
