name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@10.32.1 --activate
      - run: rustup default stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-ci-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-ci-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Verify extract-zip security patch
        run: pnpm test:supply-chain
      - name: Verify WebView security policy
        run: pnpm test:security
      - name: Verify release automation
        run: pnpm test:release
      - name: Verify format manifests
        run: pnpm test:formats
      - name: Audit dependencies
        run: pnpm audit --audit-level moderate --registry=https://registry.npmjs.org
      - run: pnpm test:coverage
      - run: pnpm build
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo llvm-cov --ignore-filename-regex '(lib|main|models|shell_integration)\.rs$' --fail-under-lines 80
        working-directory: src-tauri
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: src-tauri

  desktop-e2e:
    name: Desktop E2E (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@10.32.1 --activate
      - run: rustup default stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-e2e-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-e2e-${{ runner.os }}-
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - run: pnpm install --frozen-lockfile
      - name: Verify macOS extended-attribute preservation
        if: runner.os == 'macOS'
        run: cargo test macos_xattrs_are_preserved_by_default_and_private_ones_are_opt_in
        working-directory: src-tauri
      - run: pnpm test:e2e:build
      - name: Run desktop E2E
        if: runner.os != 'Linux'
        run: pnpm test:e2e
      - name: Run desktop E2E under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:e2e
